name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skill-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill structure
        run: python scripts/validate_skill.py
